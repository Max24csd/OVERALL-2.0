services:
  - type: web
    name: overall-inspecciones
    env: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://overall-inspecciones.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: overall-inspecciones-db
          property: connectionString

databases:
  - name: overall-inspecciones-db
    databaseName: overall_inspecciones
    user: overall_inspecciones
