<div class="section-title" style="margin-top:12px">{{ titulo }}</div>
<div class="photos">
  {% for foto_form in formset|slice:":5" %}
    <div class="photo">
      {{ foto_form.id }}
      <div class="field">
        <label>Imagen {{ forloop.counter }}</label>
        {{ foto_form.imagen }}
      </div>
      <div class="field">
        <label>Comentario</label>
        {{ foto_form.descripcion }}
      </div>
      <div class="field">
        <label>Codigo / zona</label>
        {{ foto_form.codigo_dano }}
      </div>
      {% if foto_form.instance.pk and foto_form.instance.imagen %}
        <img src="{{ foto_form.instance.imagen.url }}" alt="{{ titulo }}">
        <label>
          {{ foto_form.DELETE }}
          Eliminar
        </label>
      {% endif %}
    </div>
  {% endfor %}
</div>
